; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; jmf277: Every sketch in src defines its own setup() and loop(), so PlatformIO
; jmf277: cannot compile them together. Each environment below therefore builds
; jmf277: exactly one sketch (build_src_filter) for the same Feather ESP32 V2 board.
; jmf277: Select the environment in the VS Code status bar or with `pio run -e <name>`.

[platformio]
default_envs = servo_motor_random

[env]
platform = espressif32@7.1.0
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
lib_deps = madhephaestus/ESP32Servo@^3.2.1

[env:tt_motor]
build_src_filter = -<*> +<TT Motor.cpp>

[env:tt_motor_rotate]
build_src_filter = -<*> +<TT Motor Rotate.cpp>

[env:tt_motor_ec]
build_src_filter = -<*> +<TT Motor EC.cpp>

[env:servo_motor]
build_src_filter = -<*> +<Servo Motor.cpp>

[env:servo_motor_random]
build_src_filter = -<*> +<Servo Motor Random.cpp>

[env:servo_motor_ec]
build_src_filter = -<*> +<Servo Motor EC.cpp>
