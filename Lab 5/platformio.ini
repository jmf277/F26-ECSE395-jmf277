[env:adafruit_feather_esp32_v2]
; jmf277: Pinned to the espressif32 platform version used in Labs 3 and 4, which provides Arduino core 2.0.17.
platform = espressif32@7.1.0
board = adafruit_feather_esp32_v2
framework = arduino
; jmf277: The serial monitor speed matches Serial.begin(115200) in src/main.cpp.
monitor_speed = 115200
